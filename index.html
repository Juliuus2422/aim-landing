<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030306" />
    <title>AI Manager · L'IA qui travaille pour toi | Hit The Record</title>
    <meta name="description" content="Un système d'IA autonome qui opère ton business au quotidien : branché sur tes outils, il exécute tes tâches et capitalise ton savoir. Hébergé en France, chez toi. Tes données ne sortent jamais." />
    <style>
      html,
      body {
        margin: 0;
        background: #030306;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #030306;
      }
      #splash span {
        width: 13px;
        height: 13px;
        border-radius: 9999px;
        background: #8b5cf6;
        box-shadow: 0 0 24px 4px rgba(139, 92, 246, 0.45);
        animation: splash-pulse 1.1s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root">
      <div id="splash"><span></span></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030306" />
    <title>AI Manager · L'IA qui travaille pour toi | Hit The Record</title>
    <meta name="description" content="Un système d'IA autonome qui opère ton business au quotidien : branché sur tes outils, il exécute tes tâches et capitalise ton savoir. Hébergé en France, chez toi. Tes données ne sortent jamais." />
    <style>
      html,
      body {
        margin: 0;
        background: #030306;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #030306;
        animation: sp-in 0.4s ease-out both;
      }
      .sp-orb {
        position: relative;
        width: 68px;
        height: 68px;
      }
      .sp-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          rgba(139, 92, 246, 0) 0%,
          rgba(139, 92, 246, 0.85) 55%,
          #c4b5fd 68%,
          rgba(139, 92, 246, 0) 69%
        );
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 3px),
          #000 calc(100% - 2px)
        );
        mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 3px),
          #000 calc(100% - 2px)
        );
        animation: sp-rot 1.15s linear infinite;
      }
      .sp-ring2 {
        inset: 11px;
        background: conic-gradient(
          from 180deg,
          rgba(56, 189, 248, 0) 0%,
          rgba(56, 189, 248, 0.55) 60%,
          rgba(125, 211, 252, 0.9) 72%,
          rgba(56, 189, 248, 0) 73%
        );
        animation: sp-rot 1.7s linear infinite reverse;
      }
      .sp-core {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 10px;
        height: 10px;
        margin: -5px 0 0 -5px;
        border-radius: 50%;
        background: #a78bfa;
        box-shadow: 0 0 22px 6px rgba(139, 92, 246, 0.4);
        animation: sp-pulse 1.15s ease-in-out infinite;
      }
      .sp-brand {
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.45em;
        padding-left: 0.45em;
        text-transform: uppercase;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.3) 0%,
          rgba(255, 255, 255, 0.95) 50%,
          rgba(255, 255, 255, 0.3) 100%
        );
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        animation: sp-shim 2.2s linear infinite;
      }
      @keyframes sp-rot {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes sp-pulse {
        0%,
        100% {
          opacity: 0.45;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.2);
        }
      }
      @keyframes sp-shim {
        to {
          background-position: -200% 0;
        }
      }
      @keyframes sp-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <div class="sp-orb">
          <span class="sp-ring"></span>
          <span class="sp-ring sp-ring2"></span>
          <span class="sp-core"></span>
        </div>
        <span class="sp-brand">L'AIM</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

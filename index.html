<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fef7ec" />
    <title>AI Manager · L'IA qui travaille pour toi | Hit The Record</title>
    <meta name="description" content="Un système d'IA autonome qui opère ton business au quotidien : branché sur tes outils, il exécute tes tâches et capitalise ton savoir. Hébergé en France, chez toi. Tes données ne sortent jamais." />
    <style>
      html,
      body {
        margin: 0;
        background: #fef7ec;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background:
          radial-gradient(120vw 60vh at 50% -10%, rgba(255, 205, 134, 0.55), transparent 70%),
          #fef7ec;
        animation: sp-in 0.4s ease-out both;
      }
      .sp-brand {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 10px;
        letter-spacing: 0.25em;
        padding-left: 0.25em;
        text-transform: uppercase;
        color: rgba(38, 24, 10, 0.45);
      }
      @keyframes sp-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sp-ring,
        .sp-ring2,
        .sp-core,
        .sp-brand {
          animation: none;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <span class="sp-brand">AI Manager by Hit The Record</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
